<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>
    <h1>Login Autoescuela</h1>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Usuario: <input type="text" name="usuario" required autocomplete="username"></label><br>
        <label>Contraseña: <input type="password" name="contraseña" required autocomplete="current-password"></label><br>
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
